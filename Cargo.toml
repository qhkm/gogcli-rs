[workspace]
resolver = "2"
members = [
    "crates/gog-cli",
    "crates/gog-core",
    "crates/gog-auth",
    "crates/gog-secrets",
    "crates/gog-api",
    "crates/gog-gmail",
    "crates/gog-calendar",
    "crates/gog-drive",
    "crates/gog-contacts",
    "crates/gog-chat",
    "crates/gog-keep",
    "crates/gog-forms",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
rand = "0.8"
