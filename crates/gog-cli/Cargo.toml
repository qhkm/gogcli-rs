[package]
name = "gog-cli"
description = "Fast Google Workspace CLI — Gmail, Calendar, Drive, Contacts, Chat, Keep, Forms"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "gog"
path = "src/main.rs"

[dependencies]
gog-core = { path = "../gog-core", version = "0.1.0" }
gog-auth = { path = "../gog-auth", version = "0.1.0" }
gog-secrets = { path = "../gog-secrets", version = "0.1.0" }
gog-api = { path = "../gog-api", version = "0.1.0" }
gog-gmail = { path = "../gog-gmail", version = "0.1.0" }
gog-calendar = { path = "../gog-calendar", version = "0.1.0" }
gog-drive = { path = "../gog-drive", version = "0.1.0" }
gog-contacts = { path = "../gog-contacts", version = "0.1.0" }
gog-chat = { path = "../gog-chat", version = "0.1.0" }
gog-keep = { path = "../gog-keep", version = "0.1.0" }
gog-forms = { path = "../gog-forms", version = "0.1.0" }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
